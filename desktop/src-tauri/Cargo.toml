[package]
name = "hi3"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
base64 = "0.22"

[features]
custom-protocol = ["tauri/custom-protocol"]
